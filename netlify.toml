[build]
command = "npm run build"
publish = "dist"

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"

[[headers]]
for = "/admin/"
  [headers.values]
  X-Robots-Tag = "noindex, nofollow, noarchive"
  Referrer-Policy = "no-referrer"
  X-Frame-Options = "DENY"
  Content-Security-Policy = "object-src 'none'; frame-ancestors 'none'; base-uri 'none'"

[[headers]]
for = "/galerie/"
  [headers.values]
  X-Robots-Tag = "noindex, nofollow, noarchive"
  Referrer-Policy = "no-referrer"
  X-Frame-Options = "DENY"
  Content-Security-Policy = "object-src 'none'; frame-ancestors 'none'; base-uri 'none'"
